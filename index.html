<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --plum:#1A1030; --plum2:#2A1B4A; --plum3:#402C68;
  --gold:#E5A400; --gold-d:#A87700; --rose:#C2185B;
  --paper:#F5F4F8; --card:#fff; --line:#E6E3ED; --line2:#F0EEF5;
  --ink:#14101F; --muted:#6D6880; --muted2:#9B95AC;
  --green:#0E9F6E; --green-bg:#E7F7F0;
  --warn:#D98A00; --warn-bg:#FDF3E0;
  --red:#D92D20; --red-bg:#FDECEA;
  --grey:#98A2B3; --grey-bg:#EFEEF4;
  --r:14px; --rs:10px;
  --sh:0 1px 2px rgba(26,16,48,.05),0 8px 24px -14px rgba(26,16,48,.25);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);
  color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hide{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* AUTH */
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 15px;
  background:radial-gradient(1100px 560px at 50% -10%,#3A2560 0%,#221541 55%,#150C28 100%)}
.acard{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:24px 20px 22px;
  box-shadow:0 30px 70px -18px rgba(0,0,0,.6)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.btile{width:46px;height:46px;border-radius:13px;background:var(--plum);color:var(--gold);
  display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:-.05em}
.bt1{font-weight:800;font-size:16.5px;letter-spacing:-.02em;line-height:1.15}
.bt2{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tagline{font-size:12px;color:var(--muted);margin:-8px 0 16px;font-weight:600}
.rtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--grey-bg);padding:4px;border-radius:12px;margin-bottom:15px}
.rtabs button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:800;
  font-size:11.5px;color:var(--muted);cursor:pointer;letter-spacing:.02em}
.rtabs button.on{background:#fff;color:var(--plum);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.field{margin-bottom:12px}
label.lb{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.inp{width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:600;color:var(--ink)}
.inp:focus{border-color:var(--plum3);outline:none;box-shadow:0 0 0 3px rgba(64,44,104,.13)}
select.inp{appearance:none;padding-right:36px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%236D6880' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 11px center}
textarea.inp{min-height:88px;resize:vertical;line-height:1.5}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--plum);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.gold{background:var(--gold);color:#2A1B00}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.dgr{background:var(--red)}
.btn.sm{width:auto;padding:9px 13px;font-size:13px;border-radius:10px}
.btn.xs{width:auto;padding:6px 10px;font-size:12px;border-radius:8px}
.alert{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:12px;line-height:1.45}
.a-red{background:var(--red-bg);color:#912018} .a-green{background:var(--green-bg);color:#046C4E}
.a-info{background:#EEF0FB;color:#31358C} .a-warn{background:var(--warn-bg);color:#8A5A00}
.foot{margin-top:13px;font-size:11.5px;color:var(--muted2);text-align:center;line-height:1.55}
.foot a{color:var(--plum3);font-weight:700}

/* SHELL */
#shell{min-height:100dvh;padding-bottom:76px}
.top{background:var(--plum);color:#fff;padding:13px 15px 14px;position:sticky;top:0;z-index:40}
.toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.t1{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.t2{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.t3{font-size:11.5px;color:#B6AECB;margin-top:2px;font-weight:600}
.tbtn{background:rgba(255,255,255,.11);border:0;color:#fff;font-weight:700;font-size:11.5px;padding:7px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
main{padding:13px 13px 20px;max-width:1240px;margin:0 auto}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:45;padding:5px 3px calc(5px + env(safe-area-inset-bottom));overflow-x:auto}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 auto;min-width:58px;border:0;background:transparent;padding:5px 5px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;font-weight:800}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--plum)}
.nav button.on .nd{opacity:1}
.nd{width:15px;height:3px;border-radius:3px;background:var(--gold);opacity:0}

/* BLOCKS */
.sec{margin-bottom:15px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sect{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.pad{padding:13px}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;box-shadow:var(--sh);cursor:default}
.kpi.tap{cursor:pointer}
.kpi .k{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px;line-height:1.12}
.kpi .s{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.kpi.hero{grid-column:span 2;background:linear-gradient(135deg,#2D1D4E,#1A1030);border-color:#2D1D4E;color:#fff}
.kpi.hero .k{color:var(--gold)} .kpi.hero .s{color:#B6AECB}
.g{color:var(--green)} .r{color:var(--red)} .w{color:var(--warn)} .m{color:var(--muted2)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap}
.p-g{background:var(--green-bg);color:#046C4E} .p-w{background:var(--warn-bg);color:#8A5A00}
.p-r{background:var(--red-bg);color:#912018} .p-m{background:var(--grey-bg);color:#4B5162}
.seg{display:flex;gap:4px;background:var(--grey-bg);padding:4px;border-radius:12px;overflow:auto}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:52px;border:0;background:transparent;padding:8px 5px;border-radius:9px;font-weight:800;font-size:12px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--plum);color:#fff}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.r2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mini{background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:9px 10px}
.mini .k{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mini .v{font-size:17px;font-weight:700;margin-top:1px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--line);background:#fff;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#FAF9FC;text-align:right;padding:9px;font-size:10px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line);cursor:pointer}
th:first-child,td:first-child{text-align:left}
td{padding:9px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;font-weight:600}
tr:last-child td{border-bottom:0}
.lnk{font-weight:800;color:var(--plum);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.chip{display:inline-block;padding:2px 6px;border-radius:6px;background:var(--grey-bg);color:#4B5162;font-size:10px;font-weight:800}
.ins{display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line2);font-size:13px;font-weight:600;line-height:1.42}
.ins:last-child{border-bottom:0}
.ins i{font-style:normal;font-size:14px}
.empty{padding:24px 15px;text-align:center;color:var(--muted);font-size:13px;font-weight:600}
.cbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px;box-shadow:var(--sh);margin-bottom:10px}
.cbox h4{margin:0 0 8px;font-size:12px;font-weight:800}
.cwrap{position:relative;height:240px}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--plum);color:#fff;
  padding:11px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:90;max-width:90vw;text-align:center;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.5)}
.toast.bad{background:var(--red)}
.ovl{position:fixed;inset:0;background:rgba(15,10,28,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:680px;border-radius:20px 20px 0 0;padding:17px 15px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
@media(min-width:700px){.ovl{align-items:center}.sheet{border-radius:18px;max-height:88dvh}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px}
.sh h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.x{border:0;background:var(--grey-bg);width:31px;height:31px;border-radius:50%;font-size:16px;font-weight:800;color:var(--muted);cursor:pointer;flex:0 0 auto}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:3px}
.cd{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.cd.ok{background:#35A886} .cd.no{background:#E58585} .cd.na{background:#DCDAE4;color:#8B87A0}
.lg{display:flex;gap:11px;font-size:11px;font-weight:700;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.lg span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.5}
.hr{height:1px;background:var(--line);margin:13px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800}
.pgr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px}
.pcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;box-shadow:var(--sh)}
.pcard img{width:100%;height:150px;object-fit:cover;display:block;background:var(--grey-bg)}
.pcard .pb{padding:11px}
.pcard h5{margin:0 0 3px;font-size:14.5px;font-weight:800}
.bar{height:7px;border-radius:5px;background:var(--grey-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--plum3);border-radius:5px}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:9px;background:var(--red);
  color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.rel{position:relative}
@media(min-width:780px){
  .kgrid{grid-template-columns:repeat(4,1fr)}
  .kpi.hero{grid-column:span 2}
  .fg{grid-template-columns:repeat(4,1fr)}
  .nav{position:sticky;top:0;justify-content:center;border-top:0;border-bottom:1px solid var(--line)}
  #shell{padding-bottom:18px}
  .nav button{flex:0 0 auto;min-width:88px}
  .r2.wide{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

/* ---------------- date helpers (India) ---------------- */
const ISO = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
function todayISO(){ return ISO.format(new Date()); }
function d2(n){ return String(n).padStart(2,'0'); }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(iso){ if(!iso) return '—'; const p=iso.split('-'); return p[2]+'-'+MON[+p[1]-1]+'-'+p[0]; }
function fmtShort(iso){ const p=iso.split('-'); return p[2]+' '+MON[+p[1]-1]; }
function parse(iso){ const p=iso.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])); }
function toISO(d){ return d.getUTCFullYear()+'-'+d2(d.getUTCMonth()+1)+'-'+d2(d.getUTCDate()); }
function addDays(iso,n){ const d=parse(iso); d.setUTCDate(d.getUTCDate()+n); return toISO(d); }
function weekStart(iso){ const d=parse(iso); const w=d.getUTCDay(); const back=(w-state.settings.weekStart+7)%7;
  d.setUTCDate(d.getUTCDate()-back); return toISO(d); }
function monthStart(iso){ return iso.slice(0,7)+'-01'; }
function monthKey(iso){ return iso.slice(0,7); }
function fyStart(iso){ const y=+iso.slice(0,4), m=+iso.slice(5,7), s=state.settings.fyStart;
  return (m>=s? y : y-1)+'-'+d2(s)+'-01'; }
function fyLabel(iso){ const st=fyStart(iso); const y=+st.slice(0,4); return 'FY '+y+'–'+String(y+1).slice(2); }
function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function nowStamp(){ const d=new Date(); return new Intl.DateTimeFormat('en-GB',{timeZone:TZ,day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d); }
function monthsInRange(from,to){ const out=[]; let y=+from.slice(0,4), m=+from.slice(5,7);
  const ey=+to.slice(0,4), em=+to.slice(5,7);
  while(y<ey || (y===ey && m<=em)){ out.push(y+'-'+d2(m)); m++; if(m>12){m=1;y++;} } return out; }

function periodRange(period,asOf){
  if(period==='FTD') return [asOf,asOf];

function N(v){ const n=Number(v); return isFinite(n)?n:0; }
function int(v){ return Math.round(N(v)); }
function inr(v){ const n=N(v);
  if(Math.abs(n)>=10000000) return '₹'+(n/10000000).toFixed(2)+' Cr';
  if(Math.abs(n)>=100000) return '₹'+(n/100000).toFixed(2)+' L';
  if(Math.abs(n)>=1000) return '₹'+(n/1000).toFixed(1)+'K';
  return '₹'+Math.round(n);
}
function inrFull(v){ return '₹'+Math.round(N(v)).toLocaleString('en-IN'); }
function pct1(v){ return (Math.round(v*10)/10).toFixed(1)+'%'; }
function sgn(v){ return (v>0?'+':'')+pct1(v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

async function sha(pw){
  const salted='sbs-2026::'+pw;
  try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salted));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h1=0x811c9dc5,h2=0x1000193;
    for(let i=0;i<salted.length;i++){ h1=(h1^salted.charCodeAt(i))>>>0; h1=Math.imul(h1,16777619)>>>0;
      h2=Math.imul(h2^salted.charCodeAt(i),2654435761)>>>0; }
    return 'fb'+h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0'); }
}

function dsrKey(sid,date){ return sid+'__'+date; }

function dsrIn(ids,from,to){
  const set=new Set(ids); const out=[];

    if(set.has(r.storeId) && r.date>=from && r.date<=to) out.push(r); }
  return out.sort((a,b)=> a.date<b.date?-1:1);

/* Monthly rollups keep YTD cheap: 108 stores x 12 months instead of 39,000 daily docs */
function rollIn(ids,from,to){
  const set=new Set(ids), mk=monthsInRange(from,to), out=[];
  const partialStart = from!==monthStart(from), partialEnd = to!==monthEnd(to);
  for(const m of mk){
    const full = (m>monthKey(from) || !partialStart) && (m<monthKey(to) || !partialEnd);
    if(full){ for(const id of set){ const r=state.monthly[id+'__'+m]; if(r) out.push(r); } }
    else { const f=(m===monthKey(from))?from:m+'-01', t=(m===monthKey(to))?to:monthEnd(m+'-01');
      for(const r of dsrIn([...set],f,t)) out.push(r); }

/* ---------------- aggregation ---------------- */
function agg(rows){
  const a={ly:0,target:0,ty:0,qty:0,sQty:0,sVal:0,n:0};
  for(const r of rows){ a.ly+=N(r.ly); a.target+=N(r.target); a.ty+=N(r.ty);
    a.qty+=N(r.qty); a.sQty+=N(r.sQty); a.sVal+=N(r.sVal); a.n+=N(r.days||1); }
  a.ach = a.target>0 ? a.ty/a.target*100 : null;
  a.growth = a.ly>0 ? (a.ty-a.ly)/a.ly*100 : null;
  a.sValPct = a.ty>0 ? a.sVal/a.ty*100 : null;
  a.sQtyPct = a.qty>0 ? a.sQty/a.qty*100 : null;
  a.asp = a.sQty>0 ? a.sVal/a.sQty : null;
  return a;
}

  if(a.ach>=100) return {t:'ACHIEVED',c:'p-g'};

    return old;
  },
  async delDSR(sid,date){
    const k=dsrKey(sid,date); const old=state.dsr[k]; delete state.dsr[k];
    await DB.del(C.dsr,k); await DB.rebuildMonth(sid,monthKey(date)); return old;
  },
  /* Rollup for one store-month, recomputed from the daily rows we hold */
  async rebuildMonth(sid,mk){
    const from=mk+'-01', to=monthEnd(from);
    const rows=dsrIn([sid],from,to);
    const a=agg(rows);
    const doc={ storeId:sid, month:mk, ly:a.ly, target:a.target, ty:a.ty, qty:a.qty,
      sQty:a.sQty, sVal:a.sVal, days:rows.length, updatedAt:nowStamp() };
    state.monthly[sid+'__'+mk]=doc;
    await DB.put(C.mon, sid+'__'+mk, doc);
  },
  async saveStock(row){ const k=row.storeId+'__'+row.catId; row.current=N(row.opening)+N(row.received)-N(row.sold);
    row.updatedAt=nowStamp(); state.stock[k]=row; await DB.put(C.stk,k,row); },
  async saveProduct(p){ if(!p.id) p.id=uid(); state.products[p.id]=p; await DB.put(C.prd,p.id,p); },
  async delProduct(id){ delete state.products[id]; await DB.del(C.prd,id); },
  async saveQA(q){ if(!q.id) q.id=uid(); q.tsSort=q.tsSort||Date.now(); state.questions[q.id]=q; await DB.put(C.qa,q.id,q); },
  async notify(n){ n.id=uid(); n.ts=nowStamp(); n.tsSort=Date.now(); state.notes[n.id]=n; await DB.put(C.ntf,n.id,n); },
  async audit(action,detail,before,after){
    const s=state.session||{};
    const e={ id:uid(), ts:nowStamp(), tsSort:Date.now(), user:(s.name||s.role||'—'),
      role:s.role||'—', action, detail, before:before==null?'':JSON.stringify(before),
      after:after==null?'':JSON.stringify(after) };
    state.audit.unshift(e); if(state.audit.length>400) state.audit.pop();
    await DB.put(C.aud,e.id,e);
  }
};

async function needSetup(){ return !state.settings.pwAdmin; }

async function doSetup(){
  const a=$('#suAdmin').value.trim()||'admin', p=$('#suPw').value, p2=$('#suPw2').value;
  const ps=$('#suStore').value||'54321', pa=$('#suAm').value||'12345', pm=$('#suMgmt').value||'11111';
  if(p.length<6) return toast('Admin password needs at least 6 characters',true);
  if(p!==p2) return toast('Passwords do not match',true);
  state.settings.adminId=a;
  state.settings.pwAdmin=await sha(p);
  state.settings.pwStore=await sha(ps);
  state.settings.pwAm=await sha(pa);
  state.settings.pwMgmt=await sha(pm);
  await DB.saveSettings();
  await DB.audit('SETUP','Admin account created');
  toast('Setup complete. Please log in.');
  renderAuth();
}

async function login(){
  const err=m=>{ $('#authMsg').innerHTML='<div class="alert a-red">'+m+'</div>'; };
  if(authTab==='store'){
    const sid=$('#lgStore').value, pw=$('#lgPw').value;
    if(!sid) return err('Select your store.');
    const st=storeById(sid); if(!st) return err('Store not found.');
    const h=await sha(pw);
    const ok = (st.pwHash && h===st.pwHash) || (!st.pwHash && h===state.settings.pwStore);
    if(!ok) return err('Incorrect password for this store.');
    state.session={ role:'store', storeId:sid, name:sid, am:st.am, region:st.region };
  } else if(authTab==='am'){
    const am=$('#lgAm').value, pw=$('#lgPw2').value;
    if(!am) return err('Select your name.');
    if(await sha(pw)!==state.settings.pwAm) return err('Incorrect AM password.');
    state.session={ role:'am', am, name:am, region:amRegion(am) };
  } else if(authTab==='mgmt'){
    const u=$('#lgMu').value.trim(), pw=$('#lgMp').value;
    if(u.toLowerCase()!==String(state.settings.mgmtId).toLowerCase() || await sha(pw)!==state.settings.pwMgmt)
      return err('Incorrect management ID or password.');
    state.session={ role:'mgmt', name:'Management' };
  } else {
    const u=$('#lgAu').value.trim(), pw=$('#lgAp').value;
    if(u.toLowerCase()!==String(state.settings.adminId).toLowerCase() || await sha(pw)!==state.settings.pwAdmin)
      return err('Incorrect admin ID or password.');
    state.session={ role:'admin', name:'Super Admin' };
  }
  SS.set(LS.sess, JSON.stringify(state.session));
  state.view='home'; state.asOf=todayISO(); state.period='FTD'; state.drill=null;
  render();
}

function logout(){ SS.del(LS.sess); state.session=null; state.view='home'; state.drill=null;
  authTab='store'; render(); toast('Logged out'); }

function numField(id,label,val,big){

    '<input class="inp num" id="'+id+'" type="number" inputmode="numeric" min="0" step="1" value="'+

function editAllowed(date){
  const s=state.session;
  if(s.role==='admin') return true;
  if(s.role!=='store') return false;
  if(state.settings.histEdit==='any') return true;
  return date===todayISO();
}
function bindDSR(){
  const s=state.session, sid=s.storeId;
  const calc=()=>{
    const ty=N($('#dTy').value), tg=N($('#dTgt').value), ly=N($('#dLy').value);
    const q=N($('#dQty').value), sq=N($('#dSq').value), sv=N($('#dSv').value);
    if(!$('#dTy').value && !$('#dTgt').value){ $('#dCalc').style.display='none'; return; }
    const ach = tg>0? ty/tg*100 : null, gr = ly>0? (ty-ly)/ly*100 : null;
    const vc = ty>0? sv/ty*100 : null, qc = q>0? sq/q*100 : null;
    $('#dCalc').style.display='block';
    $('#dCalc').innerHTML='Achievement <b>'+(ach===null?'N/A':pct1(ach))+'</b> · Growth <b>'+
      (gr===null?'N/A':sgn(gr))+'</b> · Sarees value <b>'+(vc===null?'N/A':pct1(vc))+
      '</b> · Sarees qty <b>'+(qc===null?'N/A':pct1(qc))+'</b>';
  };
  ['dLy','dTgt','dTy','dQty','dSq','dSv'].forEach(id=> on('#'+id,'input',calc));
  calc();
  on('#dDate','change',e=>{ state.dsrDate=e.target.value; render(); });
  on('#dReset','click',()=>{ state.dsrDate=state.asOf; render(); });
  on('#dSave','click',async()=>{
    const date=$('#dDate').value;
    const ly=N($('#dLy').value), tg=N($('#dTgt').value), ty=N($('#dTy').value);
    const qty=N($('#dQty').value), sq=N($('#dSq').value), sv=N($('#dSv').value);
    if(!date) return toast('Choose a date',true);
    if(!state.settings.allowFuture && date>todayISO()) return toast('Future dates are not allowed',true);
    if([ly,tg,ty,qty,sq,sv].some(v=>v<0)) return toast('Values cannot be negative',true);
    if($('#dTy').value==='' || $('#dTgt').value==='') return toast('Enter TY Target and TY Sale',true);
    if(sq>qty && qty>0) return toast('Sarees qty cannot exceed store total qty',true);
    if(sv>ty && ty>0) return toast('Sarees value cannot exceed total sale',true);
    if(!editAllowed(date)) return toast('This date is locked',true);
    const b=$('#dSave'); b.disabled=true; b.innerHTML='<span class="spin"></span>Saving…';
    try{
      const old=await DB.saveDSR({ storeId:sid, date, ly, target:tg, ty, qty, sQty:sq, sVal:sv,
        remarks:$('#dRm').value.trim(), updatedBy:(state.session.name||'store') });
      await DB.audit(old?'DSR_EDIT':'DSR_CREATE', sid+' · '+fmt(date),
        old?{ly:old.ly,target:old.target,ty:old.ty}:null, {ly,target:tg,ty});
      state.dsrDate=null;
      dsrSuccess(sid,date);
    }catch(e){ console.error(e); toast('Could not save: '+e.message,true);
      b.disabled=false; b.textContent='Submit DSR'; }
  });
}
function dsrSuccess(sid,date){
  const r=getDSR(sid,date), ach=N(r.target)>0? r.ty/r.target*100:null;
  const vc=N(r.ty)>0? r.sVal/r.ty*100:null;
  openSheet('<div class="sh"><h3>DSR submitted successfully</h3><button class="x" onclick="closeSheet();render()">✕</button></div>'+
   '<div class="alert a-green">'+esc(sid)+' · '+fmt(date)+'</div>'+
   '<div class="kv"><span>TY Sale</span><b class="num">'+inrFull(r.ty)+'</b></div>'+
   '<div class="kv"><span>Target</span><b class="num">'+inrFull(r.target)+'</b></div>'+
   '<div class="kv"><span>Achievement</span><b class="num">'+(ach===null?'N/A':pct1(ach))+'</b></div>'+
   '<div class="kv"><span>Sarees value</span><b class="num">'+inrFull(r.sVal)+'</b></div>'+
   '<div class="kv"><span>Sarees contribution</span><b class="num">'+(vc===null?'N/A':pct1(vc))+'</b></div>'+
   '<div style="height:14px"></div>'+
   '<button class="btn" onclick="closeSheet();go(\'home\')">View dashboard</button>'+
   '<div style="height:8px"></div>'+
   '<button class="btn ghost" onclick="closeSheet();go(\'history\')">View history</button>');
}

/* ---------------- STOCK ---------------- */
function stockRows(sid){
  return state.cats.map(c=>{
    const k=sid+'__'+c, r=state.stock[k];
    return r||{storeId:sid,catId:c,opening:0,received:0,sold:0,current:0,value:0,updatedAt:''};
  });
}
function lowStockFor(sid){
  const min=N(state.settings.minStock);
  return stockRows(sid).filter(r=>N(r.current)<min && (N(r.opening)+N(r.received)+N(r.sold))>0)
    .map(r=>({cat:r.catId,current:N(r.current)}));
}
function stockScreen(){
  const s=state.session;
  if(s.role==='store') return stockStore(s.storeId);
  const stores=storesFor(s);
  const min=N(state.settings.minStock);
  const rows=stores.map(st=>{ const rs=stockRows(st.storeId);
    const tot=rs.reduce((x,r)=>x+N(r.current),0), val=rs.reduce((x,r)=>x+N(r.value),0);
    const low=rs.filter(r=>N(r.current)<min && (N(r.opening)+N(r.received)+N(r.sold))>0).length;
    return {st,tot,val,low}; }).filter(r=>r.tot>0||r.low>0);
  return '<div class="sec"><div class="sech"><span class="sect">Sarees stock · '+stores.length+' stores</span>'+
      '<span class="chip">Min '+min+'</span></div>'+
    (rows.length? '<div class="tw"><table><thead><tr><th>Store</th><th>Current qty</th><th>Stock value</th><th>Low cats</th></tr></thead><tbody>'+
      rows.sort((a,b)=>b.low-a.low).map(r=>'<tr><td><span class="lnk" onclick="stockDrill(\''+esc(r.st.storeId)+'\')">'+esc(r.st.storeId)+'</span></td>'+
        '<td class="num">'+int(r.tot)+'</td><td class="num">'+inr(r.val)+'</td>'+
        '<td>'+(r.low? '<span class="pill p-r">'+r.low+' low</span>':'<span class="pill p-g">OK</span>')+'</td></tr>').join('')+
      '</tbody></table></div>' : '<div class="card"><div class="empty">No stock entered yet.</div></div>')+'</div>';
}
function stockDrill(sid){ state.drill=sid; state.view='stock'; render(); window.scrollTo(0,0); }
function stockStore(sid){
  const rows=stockRows(sid), min=N(state.settings.minStock);
  const canEdit = state.session.role==='store' || state.session.role==='admin';
  const tot=rows.reduce((x,r)=>x+N(r.current),0), val=rows.reduce((x,r)=>x+N(r.value),0);
  return (state.drill? '<div class="sec"><button class="btn ghost sm" onclick="state.drill=null;render()">← All stores</button></div>':'')+
   '<div class="sec"><div class="r3">'+

     '<div class="mini"><div class="k">Current qty</div><div class="v num">'+int(tot)+'</div></div>'+

   '</div></div>'+
   '<div class="sec"><div class="sech"><span class="sect">'+esc(sid)+' · stock</span>'+
     '<span class="chip">Low below '+min+'</span></div>'+
     '<div class="tw"><table><thead><tr><th>Category</th><th>Open</th><th>Recd</th><th>Sold</th><th>Current</th><th>Value</th><th></th></tr></thead><tbody>'+
     rows.map(r=>{ const low=N(r.current)<min && (N(r.opening)+N(r.received)+N(r.sold))>0;
       return '<tr><td>'+esc(r.catId)+(low?' <span class="pill p-r">LOW</span>':'')+'</td>'+
       '<td class="num">'+int(r.opening)+'</td><td class="num">'+int(r.received)+'</td>'+

       '<td>'+(canEdit?'<button class="btn xs ghost" onclick="editStock(\''+esc(sid)+'\',\''+esc(r.catId)+'\')">Edit</button>':'')+'</td></tr>'; }).join('')+
     '</tbody></table></div>'+

function editStock(sid,cat){
  const k=sid+'__'+cat, r=state.stock[k]||{storeId:sid,catId:cat,opening:0,received:0,sold:0,value:0};
  openSheet('<div class="sh"><h3>'+esc(cat)+'</h3><button class="x" onclick="closeSheet()">✕</button></div>'+

     numField('stOp','Opening stock',r.opening)+numField('stRc','Received',r.received)+'</div>'+

     numField('stSo','Sold',r.sold)+numField('stVa','Stock value (₹)',r.value)+'</div>'+

   '<button class="btn" id="stSave">Save stock</button>');

  ['stOp','stRc','stSo'].forEach(i=>on('#'+i,'input',upd)); upd();

  });
}

/* ==================== SHARED CONTROLS ==================== */
function periodBar(){
  return '<div class="sec"><div class="seg">'+['FTD','WTD','MTD','YTD'].map(p=>
    '<button class="'+(state.period===p?'on':'')+'" onclick="state.period=\''+p+'\';render()">'+p+'</button>').join('')+
    '</div><div class="note" style="margin-top:6px;text-align:center">'+
    (()=>{const[f,t]=periodRange(state.period,state.asOf); return fmt(f)+' → '+fmt(t)+
      (state.period==='YTD'?' · '+fyLabel(state.asOf):'');})()+'</div></div>';
}
function dateBar(){
  return '<div class="sec"><div class="fg" style="grid-template-columns:1fr auto">'+
    '<input class="inp" type="date" value="'+state.asOf+'" max="'+todayISO()+'" onchange="state.asOf=this.value;render()">'+
    '<button class="btn ghost sm" onclick="state.asOf=todayISO();render()">Today</button></div></div>';
}
function filterBar(){
  const s=state.session;
  if(s.role==='store') return '';
  const showR = s.role!=='am';
  return '<div class="sec"><div class="fg">'+
    (showR? sel('region','Region',['ALL'].concat(regions())):'')+
    (showR? sel('am','AM',['ALL'].concat(ams())):'')+
    sel('type','Store type',['ALL','L2L','< 1 YR','NEW'])+
    sel('status','Status',['ALL','ACHIEVED','CLOSE','NEEDS ACTION','NO DATA'])+
   '</div><div style="height:8px"></div><button class="btn ghost sm" onclick="resetFilters()">Reset filters</button></div>';
}
function sel(k,label,opts){
  return '<div><label class="lb">'+label+'</label><select class="inp" onchange="state.filters.'+k+'=this.value;state.page=1;render()">'+
    opts.map(o=>'<option'+(state.filters[k]===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>';
}
function resetFilters(){ state.filters={region:'ALL',am:'ALL',type:'ALL',status:'ALL',q:''}; state.page=1; render(); }

function filteredStores(){
  const f=state.filters;
  return storesFor(state.session).filter(s=>
    (f.region==='ALL'||s.region===f.region) &&
    (f.am==='ALL'||s.am===f.am) &&
    (f.type==='ALL'||s.storeType===f.type));
}
function storeRows(){
  const [from,to]=periodRange(state.period,state.asOf);
  const rows=filteredStores().map(s=>{
    const a=agg(state.period==='YTD'? rollIn([s.storeId],from,to) : dsrIn([s.storeId],from,to));
    return {s,a,st:statusOf(a)};
  }).filter(r=> state.filters.status==='ALL' || r.st.t===state.filters.status);
  const k=state.sort.k, d=state.sort.d;
  rows.sort((x,y)=>{
    const gv=r=> k==='store'? r.s.storeId : (k==='ach'? (r.a.ach===null?-1e9:r.a.ach)
      : k==='growth'? (r.a.growth===null?-1e9:r.a.growth) : N(r.a[k]));
    const a=gv(x),b=gv(y);
    if(typeof a==='string') return d*a.localeCompare(b);
    return d*(a-b);
  });
  return {rows, tot:agg(rows.map(r=>r.a).map(a=>({ly:a.ly,target:a.target,ty:a.ty,qty:a.qty,sQty:a.sQty,sVal:a.sVal,days:1})))};
}
function sortBy(k){ state.sort = state.sort.k===k? {k,d:-state.sort.d} : {k,d:-1}; render(); }
function th(k,label){ const on=state.sort.k===k;
  return '<th onclick="sortBy(\''+k+'\')">'+label+(on?(state.sort.d<0?' ▾':' ▴'):'')+'</th>'; }

    (s.role==='am'? '' : chartBox('cRegion','Region-wise achievement %'))+
    chartBox('cDaily','Daily sale vs target — this month')+
    '<div class="sec"><div class="sech"><span class="sect">Top 10 stores</span>'+
      '<button class="btn xs ghost" onclick="go(\'perf\')">All stores</button></div>'+
      miniTable(rows.slice().sort((a,b)=>(b.a.ach===null?-1:b.a.ach)-(a.a.ach===null?-1:a.a.ach)).slice(0,10))+'</div>'+
    '<div class="sec"><div class="sech"><span class="sect">Needs action — bottom 10</span></div>'+
      miniTable(rows.slice().filter(r=>r.a.target>0).sort((a,b)=>(a.a.ach===null?1e9:a.a.ach)-(b.a.ach===null?1e9:b.a.ach)).slice(0,10))+'</div>';
}
function miniTable(rows){
  if(!rows.length) return '<div class="card"><div class="empty">No data in this period.</div></div>';
  return '<div class="tw"><table><thead><tr><th>Store</th><th>TY</th><th>Ach%</th><th>Gr%</th><th>Status</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td><span class="lnk" onclick="openStore(\''+esc(r.s.storeId)+'\')">'+esc(r.s.storeId)+'</span>'+
      '<div class="note">'+esc(r.s.region)+'</div></td>'+
      '<td class="num">'+inr(r.a.ty)+'</td>'+
      '<td class="num '+achCls(r.a)+'">'+(r.a.ach===null?'—':pct1(r.a.ach))+'</td>'+
      '<td class="num '+grCls(r.a.growth)+'">'+(r.a.growth===null?'N/A':sgn(r.a.growth))+'</td>'+
      '<td><span class="pill '+r.st.c+'">'+r.st.t+'</span></td></tr>').join('')+'</tbody></table></div>';
}
function insights(rows,tot,subm,total){
  const out=[];
  out.push(['📋', subm+' of '+total+' stores have submitted today\'s DSR'+(total?' ('+Math.round(subm/total*100)+'%)':'')+'.']);
  if(tot.ach!==null) out.push([tot.ach>=100?'✅':'⚠️','Cluster achieved '+pct1(tot.ach)+' of '+state.period+' target.']);
  const withAch=rows.filter(r=>r.a.ach!==null);
  if(withAch.length){
    const top=withAch.reduce((a,b)=>b.a.ach>a.a.ach?b:a);
    const bot=withAch.reduce((a,b)=>b.a.ach<a.a.ach?b:a);
    out.push(['🏆', top.s.storeId+' is leading at '+pct1(top.a.ach)+'.']);
    if(bot.a.ach<90) out.push(['🔻', bot.s.storeId+' needs attention at '+pct1(bot.a.ach)+'.']);
  }
  if(tot.growth!==null) out.push([tot.growth>=0?'📈':'📉','Sales are '+sgn(tot.growth)+' vs last year.']);
  if(tot.sValPct!==null) out.push(['🥻','Sarees contribute '+pct1(tot.sValPct)+' of total sale ('+inr(tot.sVal)+').']);
  const lowN=filteredStores().filter(s=>lowStockFor(s.storeId).length).length;
  if(lowN) out.push(['📦', lowN+' store'+(lowN>1?'s have':' has')+' saree categories below minimum stock.']);
  return out.map(([i,t])=>'<div class="ins"><i>'+i+'</i><div>'+esc(t)+'</div></div>').join('');
}

        '<td class="num">'+(r.a.sValPct===null?'—':pct1(r.a.sValPct))+'</td>'+
        '<td class="num '+(r.subm===r.n?'g':'r')+'">'+r.subm+'/'+r.n+'</td></tr>').join('')+
      '<tr style="background:#FAF9FC"><td><b>TOTAL</b></td><td class="num"><b>'+rows.reduce((x,r)=>x+r.n,0)+'</b></td>'+
        '<td class="num"><b>'+inr(tot.ly)+'</b></td><td class="num"><b>'+inr(tot.target)+'</b></td>'+

    chartBox('cGroup',(kind==='region'?'Region':'AM')+'-wise achievement %');

  const subm=stores.filter(s=>getDSR(s.storeId,state.asOf));
  const pend=stores.filter(s=>!getDSR(s.storeId,state.asOf));
  const mk=state.calMonth||monthKey(state.asOf);
  return dateBar()+filterBar()+
   '<div class="sec"><div class="r3">'+
     '<div class="mini"><div class="k">Submitted</div><div class="v num g">'+subm.length+'</div></div>'+
     '<div class="mini"><div class="k">Pending</div><div class="v num r">'+pend.length+'</div></div>'+
     '<div class="mini"><div class="k">Compliance</div><div class="v num">'+(stores.length?Math.round(subm.length/stores.length*100):0)+'%</div></div>'+
   '</div></div>'+
   '<div class="sec"><div class="sech"><span class="sect">Pending today · '+fmt(state.asOf)+'</span>'+
     (pend.length?'<button class="btn xs" onclick="remind()">Send reminder</button>':'')+'</div>'+
   (pend.length? '<div class="tw"><table><thead><tr><th>Store</th><th>Region</th><th>AM</th><th>Type</th></tr></thead><tbody>'+
     pend.map(s=>'<tr><td><span class="lnk" onclick="openStore(\''+esc(s.storeId)+'\')">'+esc(s.storeId)+'</span></td>'+

       '<td><span class="chip">'+esc(s.storeType)+'</span></td></tr>').join('')+'</tbody></table></div>'
     : '<div class="alert a-green">All stores have submitted today. Excellent compliance.</div>')+'</div>'+
   '<div class="sec"><div class="sech"><span class="sect">Monthly compliance</span>'+
     '<input class="inp" style="width:auto;padding:7px 9px;font-size:13px" type="month" value="'+mk+'" onchange="state.calMonth=this.value;render()"></div>'+
     complianceGrid(stores,mk)+'</div>';
}
function complianceGrid(stores,mk){
  const from=mk+'-01', to=monthEnd(from), today=todayISO();
  const days=daysBetween(from,to)+1;
  let filled=0, possible=0;
  const body=stores.map(s=>{
    let cells='';
    for(let i=0;i<days;i++){ const d=addDays(from,i);
      if(d>today){ cells+='<span class="cd na">'+(i+1)+'</span>'; }
      else { possible++; const has=getDSR(s.storeId,d); if(has) filled++;
        cells+='<span class="cd '+(has?'ok':'no')+'" title="'+esc(s.storeId)+' '+fmt(d)+'">'+(i+1)+'</span>'; }
    }
    return '<div style="margin-bottom:9px"><div class="note" style="margin-bottom:3px"><b>'+esc(s.storeId)+
      '</b> · '+esc(s.region)+'</div><div class="cal">'+cells+'</div></div>';
  }).join('');
  return '<div class="card pad">'+
    '<div class="note" style="margin-bottom:9px">Compliance this month: <b>'+(possible?Math.round(filled/possible*100):0)+
      '%</b> ('+filled+' of '+possible+' store-days)</div>'+
    (stores.length>25? '<div class="note" style="margin-bottom:8px">Showing first 25 stores — narrow the filters to see others.</div>':'')+
    body.split('</div><div style="margin-bottom:9px">').slice(0,25).join('</div><div style="margin-bottom:9px">')+
    '<div class="lg"><span><i class="dot" style="background:#35A886"></i>Submitted</span>'+
    '<span><i class="dot" style="background:#E58585"></i>Missing</span>'+
    '<span><i class="dot" style="background:#DCDAE4"></i>Future</span></div></div>';
}
async function remind(){
  const pend=filteredStores().filter(s=>!getDSR(s.storeId,state.asOf));
  for(const s of pend.slice(0,40))
    await DB.notify({title:'DSR pending',msg:'Please submit DSR for '+fmt(state.asOf),type:'dsr',scope:s.storeId});
  await DB.audit('REMINDER','Sent to '+pend.length+' stores for '+fmt(state.asOf));
  toast('Reminder sent to '+pend.length+' stores');
}

function answerQ(id){
  const q=state.questions[id]; if(!q) return;
  openSheet('<div class="sh"><h3>Answer question</h3><button class="x" onclick="closeSheet()">✕</button></div>'+
   '<div class="alert a-info">'+esc(q.q)+'</div>'+
   '<div class="note" style="margin-bottom:10px">'+esc(q.storeId||'')+' · '+esc(q.ts||'')+'</div>'+
   '<div class="field"><label class="lb">Your answer</label><textarea class="inp" id="ansBox">'+esc(q.a||'')+'</textarea></div>'+
   '<label class="note" style="display:flex;gap:8px;align-items:center;margin-bottom:12px">'+
     '<input type="checkbox" id="kbChk" '+(q.kb?'checked':'')+'> Mark as Knowledge Base</label>'+
   '<button class="btn" id="ansSave">Save answer</button>');
  on('#ansSave','click',async()=>{
    const a=$('#ansBox').value.trim(); if(!a) return toast('Type an answer',true);
    q.a=a; q.status='Answered'; q.kb=$('#kbChk').checked; q.answeredBy=state.session.name; q.answeredAt=nowStamp();
    await DB.saveQA(q);
    await DB.notify({title:'Your question was answered',msg:q.q.slice(0,70),type:'qa',scope:q.storeId||'all'});
    await DB.audit('QA_ANSWER',q.q.slice(0,60));
    closeSheet(); toast('Answer saved'); render();
  });
}

/* ==================== ADMIN: EDIT ENTRY ==================== */
function adminEdit(sid,date){
  const ex=getDSR(sid,date)||{};
  openSheet('<div class="sh"><h3>Correct DSR</h3><button class="x" onclick="closeSheet()">✕</button></div>'+
   '<div class="note" style="margin-bottom:10px">'+esc(sid)+'</div>'+
   '<div class="field"><label class="lb">Date</label><input class="inp" id="aeDate" type="date" value="'+date+'"></div>'+
   '<div class="fg" style="grid-template-columns:1fr 1fr">'+numField('aeLy','LY Sale',ex.ly)+numField('aeTg','TY Target',ex.target)+'</div>'+
   numField('aeTy','TY Sale',ex.ty,true)+
   '<div class="fg" style="grid-template-columns:1fr 1fr">'+numField('aeQ','Total qty',ex.qty)+numField('aeSq','Sarees qty',ex.sQty)+'</div>'+
   numField('aeSv','Sarees value',ex.sVal)+
   '<div class="field"><label class="lb">Remarks</label><input class="inp" id="aeRm" value="'+esc(ex.remarks||'')+'"></div>'+
   '<button class="btn" id="aeSave">Save correction</button>'+
   (getDSR(sid,date)?'<div style="height:8px"></div><button class="btn dgr" id="aeDel">Delete this entry</button>':''));
  on('#aeSave','click',async()=>{
    const d=$('#aeDate').value; if(!d) return toast('Choose a date',true);
    const rec={ storeId:sid, date:d, ly:N($('#aeLy').value), target:N($('#aeTg').value), ty:N($('#aeTy').value),
      qty:N($('#aeQ').value), sQty:N($('#aeSq').value), sVal:N($('#aeSv').value),
      remarks:$('#aeRm').value.trim(), updatedBy:'admin' };
    if(Object.values(rec).some(v=>typeof v==='number'&&v<0)) return toast('Values cannot be negative',true);
    const old=await DB.saveDSR(rec);
    await DB.audit('DSR_ADMIN_EDIT', sid+' · '+fmt(d),
      old?{ly:old.ly,target:old.target,ty:old.ty}:null,{ly:rec.ly,target:rec.target,ty:rec.ty});
    closeSheet(); toast('Entry corrected'); render();
  });
  on('#aeDel','click',async()=>{ if(!confirm('Delete the DSR for '+fmt(date)+'?')) return;
    const old=await DB.delDSR(sid,date);
    await DB.audit('DSR_DELETE', sid+' · '+fmt(date), old?{ty:old.ty}:null,null);
    closeSheet(); toast('Entry deleted'); render(); });
}

function masterImport(){
  return '<div class="sec"><div class="sech"><span class="sect">Import store master</span></div>'+
   '<div class="card pad">'+
     '<div class="note" style="margin-bottom:10px">Upload an Excel file with these columns: <b>STATE, REGION, TCM/AM/RM, SITE NAME(SAP), STORE TYPE, SQUARE FEET, I-Rod</b>. Existing stores are updated, new ones added. Nothing is deleted.</div>'+
     '<input class="inp" type="file" id="impFile" accept=".xlsx,.xls,.csv">'+
     '<div id="impPrev"></div></div></div>'+
   '<div class="sec"><div class="sech"><span class="sect">Export</span></div>'+
   '<div class="card pad">'+
     '<button class="btn ghost sm" onclick="exportStores(\'xlsx\')">Store master (Excel)</button> '+
     '<button class="btn ghost sm" onclick="exportRows(misRows(),\'xlsx\',\'performance\')">Performance (Excel)</button> '+
     '<button class="btn ghost sm" onclick="exportRows(misRows(),\'csv\',\'performance\')">Performance (CSV)</button> '+
     '<button class="btn ghost sm" onclick="exportStock()">Stock (Excel)</button> '+
     '<button class="btn ghost sm" onclick="backupJSON()">Full backup (JSON)</button>'+
   '</div></div>';
}
function bindImport(){
  on('#impFile','change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
        if(rows.length && !('SITE NAME(SAP)' in rows[0])){
          rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',range:1});
        }
        const norm=r=>{ const g=k=>{ for(const kk in r) if(String(kk).trim().toUpperCase()===k) return String(r[kk]).trim(); return ''; };
          return { storeId:g('SITE NAME(SAP)')||g('SITE NAME')||g('STORE'), state:g('STATE'), region:g('REGION'),
            am:g('TCM/AM/RM')||g('AM'), storeType:g('STORE TYPE'), sqft:N(g('SQUARE FEET')), irod:N(g('I-ROD')) }; };
        const parsed=rows.map(norm).filter(r=>r.storeId);
        const seen=new Set(), dupes=[];
        parsed.forEach(r=>{ if(seen.has(r.storeId)) dupes.push(r.storeId); seen.add(r.storeId); });
        const isNew=parsed.filter(r=>!state.stores[r.storeId]);
        const chg=parsed.filter(r=>{ const o=state.stores[r.storeId]; return o && (o.region!==r.region||o.am!==r.am||o.storeType!==r.storeType||N(o.sqft)!==r.sqft||N(o.irod)!==r.irod); });
        const bad=rows.length-parsed.length;
        window.__imp=parsed;
        $('#impPrev').innerHTML='<div class="hr"></div>'+
          '<div class="kv"><span>Rows read</span><b>'+rows.length+'</b></div>'+
          '<div class="kv"><span>Valid stores</span><b>'+parsed.length+'</b></div>'+
          '<div class="kv"><span>New stores</span><b class="g">'+isNew.length+'</b></div>'+
          '<div class="kv"><span>Changed stores</span><b class="w">'+chg.length+'</b></div>'+
          '<div class="kv"><span>Duplicates in file</span><b class="'+(dupes.length?'r':'')+'">'+dupes.length+'</b></div>'+
          '<div class="kv"><span>Invalid rows skipped</span><b class="'+(bad?'r':'')+'">'+bad+'</b></div>'+
          (isNew.length? '<div class="note" style="margin-top:8px">New: '+isNew.slice(0,8).map(r=>esc(r.storeId)).join(', ')+(isNew.length>8?'…':'')+'</div>':'')+
          '<div style="height:12px"></div><button class="btn" id="impGo">Confirm import ('+parsed.length+' stores)</button>';
        on('#impGo','click',doImport);
      }catch(err){ console.error(err); $('#impPrev').innerHTML='<div class="alert a-red">Could not read that file.</div>'; }
    };
    rd.readAsArrayBuffer(f);
  });
}
async function doImport(){
  const rows=window.__imp||[]; if(!rows.length) return;
  const b=$('#impGo'); b.disabled=true; b.innerHTML='<span class="spin"></span>Importing…';
  let n=0;
  for(const r of rows){
    const old=state.stores[r.storeId]||{};
    await DB.saveStore(Object.assign({},old,{ storeId:r.storeId, state:r.state||old.state||'WEST BENGAL',
      region:r.region||old.region, am:r.am||old.am, storeType:r.storeType||old.storeType||'NEW',
      sqft:r.sqft||old.sqft||0, irod:r.irod||old.irod||0,
      active: old.active===undefined? true : old.active }));
    n++;
  }
  await DB.audit('STORE_IMPORT',n+' stores imported');
  toast(n+' stores imported'); render();
}
function misRows(){
  const [from,to]=periodRange(state.period,state.asOf);
  const ids=filteredStores().map(s=>s.storeId);
  return dsrIn(ids,from,to);
}
function rowOut(r){
  const s=storeById(r.storeId)||{};
  const ach=N(r.target)>0? r.ty/r.target*100:null, gr=N(r.ly)>0?(r.ty-r.ly)/r.ly*100:null;
  return { Date:fmt(r.date), Store:r.storeId, State:s.state||'', Region:s.region||'', AM:s.am||'',
    'Store Type':s.storeType||'', 'LY Sale':N(r.ly), 'TY Target':N(r.target), 'TY Sale':N(r.ty),
    'Ach %': ach===null?'N/A':Math.round(ach*10)/10, 'Growth %': gr===null?'N/A':Math.round(gr*10)/10,
    'Gap': N(r.ty)-N(r.target), 'Total Qty':N(r.qty), 'Sarees Qty':N(r.sQty), 'Sarees Value':N(r.sVal),
    'Sarees Qty %': N(r.qty)>0? Math.round(r.sQty/r.qty*1000)/10 : 'N/A',
    'Sarees Value %': N(r.ty)>0? Math.round(r.sVal/r.ty*1000)/10 : 'N/A',
    Remarks:r.remarks||'', 'Last Updated':r.updatedAt||'', 'Updated By':r.updatedBy||'' };
}
function download(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
function exportRows(rows,kind,base){
  if(!rows.length) return toast('Nothing to export in this selection',true);
  const data=rows.map(rowOut);
  const name=base+'_'+state.period+'_'+state.asOf+'.'+(kind==='csv'?'csv':'xlsx');
  if(kind==='csv'){
    const heads=Object.keys(data[0]);
    const csv=[heads.join(',')].concat(data.map(r=>heads.map(h=>{
      const v=String(r[h]==null?'':r[h]); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','))).join('\n');
    download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),name);
  } else {
    const ws=XLSX.utils.json_to_sheet(data), wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Performance'); XLSX.writeFile(wb,name);
  }
  toast('Exported '+rows.length+' rows');
}
function exportGroup(kind){ exportRows(misRows(),'xlsx',kind); }
function exportStores(){
  const data=allStores().map(s=>({ 'SITE NAME(SAP)':s.storeId, STATE:s.state, REGION:s.region,
    'TCM/AM/RM':s.am, 'STORE TYPE':s.storeType, 'SQUARE FEET':N(s.sqft), 'I-Rod':N(s.irod),
    STATUS:s.active!==false?'ACTIVE':'INACTIVE' }));
  const ws=XLSX.utils.json_to_sheet(data), wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Store Master'); XLSX.writeFile(wb,'store_master.xlsx'); toast('Store master exported');
}
function exportStock(){
  const data=[]; for(const s of activeStores()) for(const r of stockRows(s.storeId))
    if(N(r.opening)+N(r.received)+N(r.sold)>0)
      data.push({ Store:s.storeId, Region:s.region, AM:s.am, Category:r.catId, Opening:N(r.opening),
        Received:N(r.received), Sold:N(r.sold), Current:N(r.current), Value:N(r.value), Updated:r.updatedAt||'' });
  if(!data.length) return toast('No stock entered yet',true);
  const ws=XLSX.utils.json_to_sheet(data), wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Sarees Stock'); XLSX.writeFile(wb,'sarees_stock.xlsx'); toast('Stock exported');
}
function backupJSON(){ download(new Blob([JSON.stringify(DB.blob(),null,1)],{type:'application/json'}),
  'sbs_backup_'+todayISO()+'.json'); toast('Backup downloaded'); }

/* ==================== AUDIT & SETTINGS ==================== */
function auditScreen(){
  return '<div class="sec"><div class="sech"><span class="sect">Audit log · last '+state.audit.length+' actions</span></div>'+
   (state.audit.length? '<div class="tw"><table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Detail</th><th>Before</th><th>After</th></tr></thead><tbody>'+
     state.audit.slice(0,200).map(e=>'<tr><td>'+esc(e.ts)+'</td><td style="text-align:right">'+esc(e.user)+'</td>'+
       '<td style="text-align:right"><span class="chip">'+esc(e.action)+'</span></td>'+
       '<td style="text-align:right">'+esc(e.detail||'')+'</td>'+
       '<td style="text-align:right;max-width:150px;white-space:normal">'+esc(e.before||'—')+'</td>'+
       '<td style="text-align:right;max-width:150px;white-space:normal">'+esc(e.after||'—')+'</td></tr>').join('')+
     '</tbody></table></div>' : '<div class="card"><div class="empty">No changes logged yet.</div></div>')+'</div>';
}
function settingsScreen(){
  const s=state.settings;
  return '<div class="sec"><div class="sech"><span class="sect">Business rules</span></div><div class="card pad">'+
     '<div class="field"><label class="lb">Financial year starts in</label><select class="inp" id="seFy">'+
       MON.map((m,i)=>'<option value="'+(i+1)+'"'+(N(s.fyStart)===i+1?' selected':'')+'>'+m+'</option>').join('')+'</select></div>'+
     '<div class="field"><label class="lb">Business week starts on</label><select class="inp" id="seWk">'+
       ['Sunday','Monday'].map((d,i)=>'<option value="'+i+'"'+(N(s.weekStart)===i?' selected':'')+'>'+d+'</option>').join('')+'</select></div>'+
     numField('seMin','Minimum saree stock (low-stock alert)',s.minStock)+
     '<div class="field"><label class="lb">Historical editing by stores</label><select class="inp" id="seHe">'+
       '<option value="sameDay"'+(s.histEdit==='sameDay'?' selected':'')+'>Same day only (recommended)</option>'+
       '<option value="any"'+(s.histEdit==='any'?' selected':'')+'>Any past date</option></select></div>'+
     '<label class="note" style="display:flex;gap:8px;align-items:center;margin-bottom:12px">'+
       '<input type="checkbox" id="seFu" '+(s.allowFuture?'checked':'')+'> Allow future-dated DSR</label>'+
     '<button class="btn" id="seSave">Save settings</button></div></div>'+
   '<div class="sec"><div class="sech"><span class="sect">Passwords</span></div><div class="card pad">'+
     '<div class="note" style="margin-bottom:10px">Leave blank to keep unchanged. Stored as irreversible hashes.</div>'+
     '<div class="field"><label class="lb">Store user password (common)</label><input class="inp" id="pwS" type="password"></div>'+
     '<div class="field"><label class="lb">AM password</label><input class="inp" id="pwA" type="password"></div>'+
     '<div class="field"><label class="lb">Management password</label><input class="inp" id="pwM" type="password"></div>'+
     '<div class="field"><label class="lb">Admin password</label><input class="inp" id="pwAd" type="password"></div>'+
     '<button class="btn" id="pwSave">Update passwords</button></div></div>'+
   '<div class="sec"><div class="sech"><span class="sect">Data</span></div><div class="card pad">'+
     '<button class="btn ghost sm" onclick="backupJSON()">Download full backup</button> '+
     '<button class="btn ghost sm" onclick="cloudSheet()">Cloud database</button>'+
     '<div class="note" style="margin-top:10px">'+(state.mode==='cloud'?'☁ Connected — all devices share this data.':'▣ Local mode — this device only.')+'</div>'+
   '</div></div>';
}
function bindSettings(){
  on('#seSave','click',async()=>{
    state.settings.fyStart=N($('#seFy').value); state.settings.weekStart=N($('#seWk').value);
    state.settings.minStock=N($('#seMin').value); state.settings.histEdit=$('#seHe').value;
    state.settings.allowFuture=$('#seFu').checked;
    await DB.saveSettings(); await DB.audit('SETTINGS_UPDATE','Business rules'); toast('Settings saved'); render();
  });
  on('#pwSave','click',async()=>{
    const m=[['pwS','pwStore'],['pwA','pwAm'],['pwM','pwMgmt'],['pwAd','pwAdmin']];
    let n=0;
    for(const [el,key] of m){ const v=$('#'+el).value; if(v){ if(v.length<5) return toast('Passwords need at least 5 characters',true);
      state.settings[key]=await sha(v); n++; } }
    if(!n) return toast('Nothing to change',true);
    await DB.saveSettings(); await DB.audit('PASSWORD_CHANGE',n+' password(s) updated');
    toast(n+' password(s) updated'); render();
  });
}

/* ==================== CHARTS ==================== */
let charts={};
function chartBox(id,title){ return '<div class="cbox"><h4>'+esc(title)+'</h4><div class="cwrap"><canvas id="'+id+'"></canvas></div></div>'; }
const CC={plum:'#402C68',gold:'#E5A400',rose:'#C2185B',grey:'#B9B4C6',green:'#0E9F6E',red:'#D92D20'};
function mk(id,type,data,opts){
  const el=document.getElementById(id); if(!el||typeof Chart==='undefined') return;
  if(charts[id]) charts[id].destroy();
  charts[id]=new Chart(el,{type,data,options:Object.assign({responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{boxWidth:11,font:{size:11,family:'Manrope'}}}},
    scales:{x:{ticks:{font:{size:9.5},maxRotation:60,minRotation:0}},y:{beginAtZero:true,ticks:{font:{size:10}}}}},opts||{})});
}
function drawCharts(){
  const s=state.session, ids=scopeIds(s);
  const mkk=monthKey(state.asOf), mfrom=mkk+'-01', mto=monthEnd(mfrom);
  const days=dsrIn(ids,mfrom,Math.min?state.asOf:state.asOf);
  const byDate={}; days.forEach(r=>{ const k=r.date; byDate[k]=byDate[k]||{ly:0,target:0,ty:0,sVal:0,sQty:0,qty:0};
    ['ly','target','ty','sVal','sQty','qty'].forEach(f=>byDate[k][f]+=N(r[f])); });
  const dates=Object.keys(byDate).sort(), lbl=dates.map(fmtShort);

  if(document.getElementById('cTrend')||document.getElementById('cDaily')){
    const id=document.getElementById('cTrend')?'cTrend':'cDaily';
    mk(id,'bar',{labels:lbl,datasets:[
      {label:'Target',data:dates.map(d=>byDate[d].target),backgroundColor:CC.grey,borderRadius:3},
      {label:'TY Sale',data:dates.map(d=>byDate[d].ty),backgroundColor:CC.plum,borderRadius:3},
      {label:'LY Sale',type:'line',data:dates.map(d=>byDate[d].ly),borderColor:CC.gold,backgroundColor:CC.gold,tension:.3,pointRadius:2}]});
  }
  if(document.getElementById('cSarees')){
    mk('cSarees','bar',{labels:lbl,datasets:[
      {label:'Sarees value',data:dates.map(d=>byDate[d].sVal),backgroundColor:CC.rose,borderRadius:3},
      {label:'Other sales',data:dates.map(d=>Math.max(0,byDate[d].ty-byDate[d].sVal)),backgroundColor:CC.grey,borderRadius:3}]},
      {scales:{x:{stacked:true,ticks:{font:{size:9.5}}},y:{stacked:true,beginAtZero:true}}});
  }
  if(document.getElementById('cSqty')){
    mk('cSqty','line',{labels:lbl,datasets:[
      {label:'Sarees qty',data:dates.map(d=>byDate[d].sQty),borderColor:CC.rose,backgroundColor:'rgba(194,24,91,.12)',fill:true,tension:.3,pointRadius:2},
      {label:'Total qty',data:dates.map(d=>byDate[d].qty),borderColor:CC.plum,tension:.3,pointRadius:2}]});
  }
  if(document.getElementById('cStores')){
    const {rows}=storeRows();
    const top=rows.slice().sort((a,b)=>b.a.ty-a.a.ty).slice(0,12);
    mk('cStores','bar',{labels:top.map(r=>r.s.storeId.replace(/^(EB|SB)-/,'')),datasets:[
      {label:'Target',data:top.map(r=>r.a.target),backgroundColor:CC.grey,borderRadius:3},
      {label:'TY Sale',data:top.map(r=>r.a.ty),backgroundColor:CC.plum,borderRadius:3}]});
  }
  if(document.getElementById('cRegion')||document.getElementById('cGroup')){
    const id=document.getElementById('cRegion')?'cRegion':'cGroup';
    const kind = (state.view==='am')?'am':'region';
    const keys = kind==='am'? ams():regions();
    const [f,t]=periodRange(state.period,state.asOf);
    const dat=keys.map(k=>{ const sid=filteredStores().filter(x=>(kind==='am'?x.am:x.region)===k).map(x=>x.storeId);
      const a=agg(state.period==='YTD'? rollIn(sid,f,t):dsrIn(sid,f,t)); return {k,v:a.ach===null?0:a.ach}; })
      .filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    mk(id,'bar',{labels:dat.map(x=>x.k),datasets:[{label:'Achievement %',data:dat.map(x=>Math.round(x.v*10)/10),
      backgroundColor:dat.map(x=>x.v>=100?CC.green:(x.v>=90?CC.gold:CC.red)),borderRadius:3}]},
      {plugins:{legend:{display:false}}});
  }
  if(document.getElementById('cStoreTrend')){
    const sid=state.drill, mkm=state.calMonth||mkk;
    const rs=dsrIn([sid],mkm+'-01',monthEnd(mkm+'-01'));
    mk('cStoreTrend','bar',{labels:rs.map(r=>fmtShort(r.date)),datasets:[
      {label:'Target',data:rs.map(r=>N(r.target)),backgroundColor:CC.grey,borderRadius:3},
      {label:'TY Sale',data:rs.map(r=>N(r.ty)),backgroundColor:CC.plum,borderRadius:3},
      {label:'LY',type:'line',data:rs.map(r=>N(r.ly)),borderColor:CC.gold,tension:.3,pointRadius:2}]});
  }
}

/* ==================== ROUTER ==================== */
function render(){
  if(!state.session){ renderAuth(); return; }
  $('#auth').classList.add('hide'); $('#shell').classList.remove('hide');
  headerFor(); renderNav();
  const r=state.session.role; const v=state.view;
  let html='';
  if(r==='store'){
    html = v==='dsr'? storeDSR() : v==='sarees'? sareesScreen() : v==='stock'? stockStore(state.session.storeId)
      : v==='learn'? learnScreen() : v==='history'? historyScreen() : storeHome();
  } else {
    if(v==='storeDetail') html=storeDetail();
    else if(v==='region') html=groupScreen('region');
    else if(v==='am') html=groupScreen('am');
    else if(v==='perf') html=perfScreen();
    else if(v==='pending') html=pendingScreen();
    else if(v==='sarees') html=periodBar()+filterBar()+sareesScreen();
    else if(v==='stock') html= state.drill? stockStore(state.drill) : stockScreen();
    else if(v==='learn') html=learnScreen();
    else if(v==='qa'&&r==='admin') html=qaScreen();
    else if(v==='master'&&r==='admin') html=masterScreen();
    else if(v==='audit'&&r==='admin') html=auditScreen();
    else if(v==='settings'&&r==='admin') html=settingsScreen();
    else html=controlHome();
  }
  $('#view').innerHTML=html;
  if(v==='dsr') bindDSR();
  if(v==='learn') bindAsk();
  if(v==='settings') bindSettings();
  if(v==='master'&&(state.tab||'stores')==='import') bindImport();
  setTimeout(drawCharts,30);
}

/* ==================== BOOT ==================== */
async function boot(){
  state.asOf=todayISO(); state.calMonth=monthKey(state.asOf);
  try{ await DB.init(); }catch(e){ console.error(e); }
  if(!Object.keys(state.stores).length) await DB.seedStores();
  if(!state.cats.length) state.cats=DEFAULT_CATS.slice();
  state.ready=true;
  try{ const s=JSON.parse(SS.get(LS.sess)||'null');
    if(s && (s.role!=='store' || storeById(s.storeId))) state.session=s; }catch(e){}
  render();
}
window.addEventListener('DOMContentLoaded',boot);

/* test hooks */
window.state=state; window.DB=DB; window.render=render; window.agg=agg; window.aggFor=aggFor;
window.dsrIn=dsrIn; window.rollIn=rollIn; window.storeRows=storeRows; window.misRows=misRows;
window.activeStores=activeStores; window.storeById=storeById; window.regions=regions; window.ams=ams;
window.periodRange=periodRange; window.lowStockFor=lowStockFor; window.stockRows=stockRows;
window.todayISO=todayISO; window.monthEnd=monthEnd; window.sha=sha; window.N=N; window.int=int;
